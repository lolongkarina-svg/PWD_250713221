<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Workshop</title>
</head>
<body>
    <h1>Formulir Pendaftaran Workshop</h1>
    <form action="" method="post" enctype="multipart/form-data">
        <h2>Data Peserta</h2>
        <table cellspacing="4" cellpadding="4" border="1"
               style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;">
                    <label for="nama"><strong>Nama Lengkap</strong></label>
                </td>
                <td>
                    <input type="text" id="nama" name="nama" size="30" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="nim"><strong>NIM</strong></label>
                </td>
                <td>
                    <input type="text" id="nim" name="nim" size="30" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <strong>Jenis Kelamin</strong>
                </td>
                <td>
                    <input type="radio" id="laki" name="jk" value="Laki-laki" />
                    <label for="laki">Laki-laki</label>
                    <input type="radio" id="perempuan" name="jk" value="Perempuan" />
                    <label for="perempuan">Perempuan</label>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="prodi"><strong>Program Studi</strong></label>
                </td>
                <td>
                    <select id="prodi" name="prodi">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>
        </table>

        <h2>Pilihan Workshop</h2>
        <table cellspacing="4" cellpadding="4" border="1"
               style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;">
                    <strong>Jenis Peserta</strong>
                </td>
                <td>
                    <input type="radio" id="mahasiswa" name="jenis_peserta" value="Mahasiswa" />
                    <label for="mahasiswa">Mahasiswa</label>
                    <input type="radio" id="umum" name="jenis_peserta" value="Umum" />
                    <label for="umum">Umum</label>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <strong>Materi Workshop</strong>
                </td>
                <td>
                    <input type="checkbox" id="uiux" name="materi[]" value="UI/UX Design" />
                    <label for="uiux">UI/UX Design</label>
                    <br />
                    <input type="checkbox" id="web" name="materi[]" value="Web Development" />
                    <label for="web">Web Development</label>
                    <br />
                    <input type="checkbox" id="data" name="materi[]" value="Data Analysis" />
                    <label for="data">Data Analysis</label>
                </td>
            </tr>
        </table>

        <h2>Informasi Tambahan</h2>
        <table cellspacing="4" cellpadding="4" border="1"
               style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;">
                    <label for="alasan"><strong>Alasan Mengikuti Workshop</strong></label>
                </td>
                <td>
                    <textarea id="alasan" name="alasan" rows="8" cols="30"></textarea>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <strong>Jenis Pembayaran</strong>
                </td>
                <td>
                    <input type="radio" id="qris" name="pembayaran" value="QRIS" />
                    <label for="qris">QRIS</label>
                    <input type="radio" id="transfer" name="pembayaran" value="Transfer Bank" />
                    <label for="transfer">Transfer Bank</label>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="bukti"><strong>Bukti Pembayaran</strong></label>
                </td>
                <td>
                    <input type="file" id="bukti" name="bukti" />
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" name="daftar" value="Daftar" />
                </td>
            </tr>
        </table>

    </form>
</body>
</html>
